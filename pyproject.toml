[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pose-domain-eval"
version = "0.1.0"
description = "三维人体姿态从合成域到真实域的统一评测"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "RaYanwsl" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pose-eval = "pose_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
